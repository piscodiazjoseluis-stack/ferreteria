name: Desplegar Ferretería

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ferreteria-v2-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 55432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verificar frontend antes de publicar
        run: |
          npm ci --prefix frontend
          npm run lint --prefix frontend
          npm run build --prefix frontend
          npm audit --prefix frontend --audit-level=high
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Verificar API y reglas contra PostgreSQL aislado
        env:
          PYTHONUTF8: '1'
        run: |
          pip install -r backend/requirements.txt
          python backend/scripts/bootstrap_test_database.py
          python backend/scripts/verify_final.py
      - name: Instalar Vercel CLI
        run: npm install --global vercel@latest
      - name: Publicar en el proyecto V2 existente
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: vercel deploy --prod --yes
